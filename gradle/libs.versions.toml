[versions]
agp = "9.3.1"
kotlin = "2.4.10"
camerax = "1.6.1"
mlkit-pose = "18.0.0-beta5"
activity = "1.13.0"
# GPU delegate écarté : tensorflow-lite-gpu (2.13/2.16/2.17, LiteRT 1.0.1)
# référence GpuDelegateFactory$Options sans le livrer -> NoClassDefFoundError.
tensorflow = "2.17.0"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-pose-detection = { group = "com.google.mlkit", name = "pose-detection", version.ref = "mlkit-pose" }
mlkit-pose-detection-accurate = { group = "com.google.mlkit", name = "pose-detection-accurate", version.ref = "mlkit-pose" }
tflite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflow" }
tflite-gpu = { group = "org.tensorflow", name = "tensorflow-lite-gpu", version.ref = "tensorflow" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
